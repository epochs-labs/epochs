[workspace]
members = ["epochs-core", "epochql", "epochs-cli", "epochs-bench", "epochs-server", "epochs-client"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/epochs-labs/epochs"
homepage = "https://github.com/epochs-labs/epochs"
readme = "README.md"
authors = ["Epochs Labs contributors"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
bincode = "1"
thiserror = "2"
blake3 = "1"
dashmap = "6"
arc-swap = "1"
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "io-util", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
