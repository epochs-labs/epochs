[package]
name = "epochs-server"
description = "Epoch Protocol (EPX) server for epochs (single-writer DiskStore + EpochQL)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
authors.workspace = true
keywords = ["database", "merkle", "dag", "protocol", "server"]
categories = ["database-implementations", "network-programming"]

[lib]
name = "epochs_server"
path = "src/lib.rs"

[[bin]]
name = "epochs-server"
path = "src/main.rs"

[dependencies]
epochs-core = { path = "../epochs-core", version = "0.1.0" }
epochql = { path = "../epochql", version = "0.1.0" }
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
serde_json.workspace = true
