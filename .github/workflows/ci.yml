name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt · clippy · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2
        with:
          key: coverage

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Generate coverage
        run: |
          cargo llvm-cov --workspace --locked \
            --exclude epochs-bench \
            --lcov --output-path lcov.info
          cargo llvm-cov report --summary-only | tee coverage-summary.txt

      - name: Fetch main baseline
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p baseline
          set +e
          for RUN_ID in $(gh run list \
            --repo "${{ github.repository }}" \
            --branch main \
            --workflow CI \
            --status success \
            --limit 30 \
            --json databaseId \
            --jq '.[].databaseId'); do
            if gh run download "$RUN_ID" \
              --repo "${{ github.repository }}" \
              -n coverage-baseline \
              -D baseline 2>/dev/null; then
              echo "Downloaded baseline from run $RUN_ID"
              break
            fi
          done
          if [ ! -f baseline/coverage.json ]; then
            echo "No coverage-baseline artifact on recent main runs yet"
          fi
          set -e

      - name: Gate coverage
        id: gate
        run: |
          BASELINE_ARGS=()
          if [ -f baseline/coverage.json ]; then
            BASELINE_ARGS=(--baseline-json baseline/coverage.json)
          fi
          python3 .github/scripts/coverage_gate.py \
            --summary coverage-summary.txt \
            --out-json coverage.json \
            --floor-file .github/coverage-floor \
            --max-drop 1.0 \
            --commit "${{ github.sha }}" \
            "${BASELINE_ARGS[@]}"
          echo "percent=$(python3 -c 'import json; print(json.load(open("coverage.json"))["line_percent"])')" >> "$GITHUB_OUTPUT"

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Test coverage (cargo-llvm-cov)"
            echo
            if [ -f coverage-summary.txt ]; then
              echo '```'
              cat coverage-summary.txt
              echo '```'
            fi
            echo
            if [ -f coverage.json ]; then
              echo "Parsed line coverage: **$(python3 -c 'import json; print(json.load(open("coverage.json"))["line_percent"])')%**"
            fi
            echo
            echo "Floor: \`.github/coverage-floor\` · PRs may not drop >1pp vs latest \`main\` baseline artifact."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on PR
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python3 .github/scripts/coverage_pr_comment.py

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-baseline
          path: |
            coverage.json
            coverage-summary.txt
            lcov.info
          if-no-files-found: ignore
