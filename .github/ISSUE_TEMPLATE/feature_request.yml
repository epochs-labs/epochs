name: Feature request
description: Propose a capability or API change
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Check the README roadmap first (Proly, server, THREE_WAY merge, etc.).
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that is hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Sketch of API / behavior (optional but helpful)
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - epochs-core
        - epochql
        - epochs-cli
        - epochs-bench / docs
        - unsure
    validations:
      required: true
