name: Bug report
description: Something is broken or incorrect
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. epochs is **0.1.x** — include repro steps so we can act quickly.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Actual vs expected behavior
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Commands, EpochQL, or a minimal repo layout
      placeholder: |
        epochs init
        epochs query '...'
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: main @ abc1234 or crates.io 0.1.0
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      placeholder: OS, rustc version (`rustc -V`)
